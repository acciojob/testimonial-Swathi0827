<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
  <title>Testimonial Section</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .testimonial-section {
      padding: 40px;
      background-color: #f5f5f5;
    }

    .testimonial {
      background-color: white;
      border: 1px solid #ddd;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .testimonial-text {
      font-size: 16px;
      color: #333;
    }

    .testimonial-author {
      text-align: right;
      font-style: italic;
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>
<body>
 <div class="testimonial-section">
    <div class="testimonial">
      <p class="testimonial-text">"This product changed my life! Highly recommended to everyone."</p>
      <p class="testimonial-author">- John Doe</p>
    </div>
    <div class="testimonial">
      <p class="testimonial-text">"Fantastic service and great results. Will definitely come back."</p>
      <p class="testimonial-author">- Jane Smith</p>
    </div>
    <div class="testimonial">
      <p class="testimonial-text">"A reliable team that delivers exactly what they promise."</p>
      <p class="testimonial-author">-</p>
	</div>
	  

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
